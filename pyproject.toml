[project]
name = "productpulse-ai"
version = "1.0.0"
description = "Turn customer feedback into your next best product decision."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # asserts are fine in tests and as defence-in-depth checks
  "RUF001", "RUF002", "RUF003",  # intentional typographic characters (×, –, “ ”) in UI text
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["semantic: needs the sentence-transformers model (downloads ~90 MB on first run)"]
